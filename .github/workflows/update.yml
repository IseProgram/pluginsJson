name: plugin.json を追従元に合わせて更新

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 追従元から plugin.json を作り直す
        run: python3 scripts/update_plugins.py

      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- plugin.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin.json
          git commit -m "plugin.json を追従元に合わせて更新"
          git push

      # 公開リポジトリの定期実行は、60日間リポジトリに動きが無いと GitHub が自動で止める。
      # 有効化をかけ直すとその期限が延びるので、実行のたびに呼ぶ
      - name: 定期実行が止められないようにする
        run: gh workflow enable update.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
